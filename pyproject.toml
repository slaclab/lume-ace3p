[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lume-ace3p"
version = "0.3.5"
requires-python = ">=3.9"
dependencies = [
    "lume-base>=0.3.3",
    "xopt>=3.0.0",
    "ruamel.yaml",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "numpyro",
]

[project.scripts]
run-lume-ace3p = "lume_ace3p.run_lume_ace3p:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# There is deliberately NO excluded-by-default test tier. The old 'slow' marker
# held botorch GP-fitting tests that cost minutes-to-hours each (one did not
# finish in 2h), so in practice they were never run and gated nothing; they were
# removed in 2026-08 (see tests/test_run_xopt_compat.py and
# baseline_utils.NOT_FROZEN). `pytest` now means the whole suite.
