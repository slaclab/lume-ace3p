[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lume-ace3p"
version = "0.3.2"
requires-python = ">=3.9"
dependencies = [
    "lume-base>=0.3.3",
    "xopt>=3.0.0",
    "ruamel.yaml",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
]

[project.scripts]
run-lume-ace3p = "lume_ace3p.run_lume_ace3p:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow, botorch-backed GP-fitting tests (real model construction + stepping) are
# excluded by default so the routine suite stays fast. Opt in for a full run
# before a master merge:  pytest -m slow   (or  pytest -m ""  for everything).
addopts = "-m 'not slow'"
markers = [
    "slow: botorch GP-fitting tests (~minutes each); excluded by default, run with -m slow",
]
