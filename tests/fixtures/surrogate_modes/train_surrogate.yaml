# Geant4 dose-surrogate TRAINING (Phase 3 of the surrogate + inversion project).
#
# Consumes the training store produced by the sibling collection example
# (geant4_beta_surrogate.yaml, mode: collect_training_data) and fits the
# reduced-basis PCA-GP forward surrogate: beta in R^8 -> full dose profile.
#
#   1. Stack every sample's dose grid, subtract the mean, take an SVD, and keep
#      the leading POD modes (dose fields are smooth + low-rank; PCA also
#      denoises the Geant4 Monte-Carlo shot noise -- coherent beta signal lands
#      in the leading modes, incoherent noise in the discarded tail).
#   2. Fit one Gaussian Process per retained coefficient, beta -> c_i, each with
#      a genuine fitted noise term (correctness constraint #2: the dose is
#      MC-noisy, so NO low-noise / interpolating prior).
#
# The saved model exposes predict_dose(beta) and project(dose), the single
# coefficient-space seam the inversion mode talks to.
#
# NOTE there is deliberately NO 'workflow:' block. train_surrogate is a
# STORE-CONSUMING mode: it does not run the Geant4 chain, it reads the
# already-collected (beta, dose) pairs, and the store's manifest already carries
# the pinned bin_edges / scoring-mesh invariants. So this config declares only
# what the mode actually reads. (The same applies to invert_optimize; every other
# mode does require a 'workflow:' list.) This step is CPU-only -- no Geant4
# environment, no ACE3P paths.

mode :
  type : train_surrogate
  store : 'geant4_beta_surrogate_store'   # the collect_training_data store to fit
  variance : 0.99                         # cumulative POD energy to retain (picks k)
  # num_components : 8                     # or pin k explicitly (overrides variance)
  seed : 0                                # reproducible GP restart search
  model_dir : 'geant4_beta_surrogate_store/surrogate'   # where the model is saved
  holdout : 0.2                           # hold out 20% for an accuracy report
                                          # (relative-L2 + mean predicted std)
  # dose_transform : 'log10'              # fit log10(dose+floor) instead of raw
                                          # dose. Dose is exponential in beta
                                          # (Fowler-Nordheim) and spans ~9 orders
                                          # of magnitude across voxels, so a linear
                                          # fit is dominated by the peak voxels and
                                          # barely learns the dose SHAPE; log space
                                          # fits far better (holdout relative-L2
                                          # ~0.2 vs ~2 linear). The holdout report
                                          # is then measured in log space. NOTE:
                                          # inverting a log prediction back to
                                          # linear amplifies tail error, so treat
                                          # the log-space model as a shape model.
  # floor : 1.0e-6                        # positive offset for log10 (default: the
                                          # smallest positive training dose)
  # n_jobs : -1                           # parallelize the per-mode GP fits over
                                          # CPU cores (1 = serial default, -1 = all
                                          # cores). The GPs are independent, so this
                                          # is result-invariant (~7x faster on the
                                          # 64-sample log10 fit). More samples ->
                                          # more modes -> better scaling on a big
                                          # node; this CPU-only step never needs one
                                          # otherwise.
