# S3P scalar optimization (NelderMead) on the declarative module/mode schema:
#   workflow:           cubit -> s3p     (the pipeline, ordered by artifact deps)
#   mode:               scalar_optimize  (how it is driven — an Xopt loop)
#   output_parameters:  what scalar the objective pulls out of which module
# The VOCS objective name ('reflection') is an output_parameters name, so the
# Xopt driver never parses S-parameters itself — extraction is a workflow concern.

workflow_parameters :
    'workdir' : 'lume-ace3p_xopt_workdir'

workflow :
  - module : cubit
    journal : 'bend-90degree.jou'
  - module : s3p
    input : 'bend-90degree.s3p'
    tasks : 16
    cores : 8
    opts : '--cpu-bind=cores'

mode :
    type : scalar_optimize

# Declare the optimization knobs and where they live. Both are Cubit journal
# variables, so they go under 'cubit:'. This gives each VOCS variable an explicit
# home: an Xopt variable routes to the bucket where it is declared, so an
# optimization can drive Cubit, ACE3P, and Geant4 parameters at once. The scalar
# values are nominal starting points (Xopt overrides them each step).
input_parameters :
    cubit :
        'cornercut' : 15.0
        'rcorner1' : 1.0

output_parameters :
    'reflection' : { module: s3p, quantity: 'S(0,0)', at: { frequency: 12.0e+09 } }

vocs_parameters :
    'variables' :          # bounds only; names route via input_parameters above
        'cornercut' : [14, 17]
        'rcorner1' : [0.5, 2.5]
    'objectives' :
        'reflection' : 'MINIMIZE'

xopt_parameters :
    'generator' : 'NelderMeadGenerator'
    'num_random' : 0
    'num_step' : 25
