# Omega3P sweep with an ACE3P input parameter as an extra sweep axis, on the
# declarative module/mode schema:
#   workflow:  cubit -> omega3p -> acdtool
#   mode:      parameter_sweep
# The ACE3P 'Sigma: [5.8e7, 1.04e7]' list is a two-value axis, so the sweep is
# 4 x 4 x 2 = 32 runs (two cubit axes x the ACE3P Sigma axis). The mode iterates
# every swept axis generically, so the ACE3P axis rides alongside the cubit ones
# with no special-casing and appears as its own column in the result table.

workflow_parameters :
  'workdir' : 'lume-ace3p_omega3p_workdir'
  'workdir_mode' : 'auto'

workflow :
  - module : cubit
    journal : 'pillbox-rtop.jou'
  - module : omega3p
    input : 'pillbox-rtop.omega3p'
    tasks : 12
    cores : 8
    opts : '--cpu-bind=cores'
  - module : acdtool
    input : 'pillbox-rtop.rfpost'

mode :
  type : parameter_sweep
  output_file : 'omega3p_sweep_output.txt'

input_parameters :
  cubit :
    'cav_radius' :
      'min' : 90.0
      'max' : 120.0
      'num' : 4
    'ellipticity' :
      'min' : 0.5
      'max' : 1.25
      'num' : 4
  ace3p :
    'ModelInfo' :
        'SurfaceMaterial' :
            'ReferenceNumber' : 6
            'Sigma' : [5.8e7, 1.04e7]

output_parameters :
  'R/Q' : ['RoverQ', '0', 'RoQ']
  'Mode_freq' : ['RoverQ', '0', 'Frequency']
  'E_max' : ['maxFieldsOnSurface', '6', 'Emax']
  'loc_x' : ['maxFieldsOnSurface', '6', 'Emax_location', 'x']
  'loc_y' : ['maxFieldsOnSurface', '6', 'Emax_location', 'y']
  'loc_z' : ['maxFieldsOnSurface', '6', 'Emax_location', 'z']
