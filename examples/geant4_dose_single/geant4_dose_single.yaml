# Single-shot runnable multi-step chain: external Track3P dump -> field-emission
# weighting -> Geant4 dose, evaluated once (not swept) with a fixed per-bin beta
# vector, and pulling scalar dose/edep totals out of the Geant4 output:
#   workflow:  track3p_source -> field_emission -> geant4
#   mode:      single  (one evaluation, one result row)
#
# This is the declarative expression of the full downstream-dose pipeline the
# architecture is meant to make first-class. The large shared assets (Track3P
# dump + STL geometry + Geant4 input) live in ../assets/ and are referenced by
# relative path, so run this from THIS directory. With the Geant4
# binary absent the run is dry-run: the particle-weighting step still executes
# for real and writes particles.data; the dose scalars are NaN until a real
# Geant4 run produces the scoring files.

workflow_parameters :
  'workdir' : 'lume-ace3p_dose_workdir'
  'workdir_mode' : 'manual'
  'stage_mode' : 'symlink'                      # symlink large static inputs (Track3P dump,
                                                # STL geometry) into the workdir instead of
                                                # copying. copy (default) | symlink | hardlink
  'paths' :
    'geant4_app_path' : '/sdf/group/rfar/geant4/example/dose-npass'
    'geant4_app_exe' : 'sim'

workflow :
  - module : track3p_source
    file : '../assets/sample_track3p_particles.txt'
  # Plain Fowler-Nordheim ('fn', the default) with the LCLS-II reference
  # converter's constants, as in geant4_track3p_beta; here beta is a fixed
  # per-bin vector rather than a swept scalar. The beta values are NOT the
  # study's 100-150: this dump's InitialNormalField averages 3.7e7 V/m, about 4x
  # Lixin's cryomodule, so the same beta*E is reached at about a quarter of the
  # beta. Above ~55 every macroparticle clears the one-electron cut and the
  # per-bin structure washes out; 44-50 straddles the onset, so the bins differ.
  - module : field_emission
    impact_order : 1
    impact_face_id : 6
    work_function : 4.2
    frequency : 1.2999e9
    min_energy_ev : 1000.0
    num_bins : 8
    beta : [44, 46, 48, 50, 50, 48, 46, 44]
    output_format : 'geant4'
    output : 'particles.data'
  - module : geant4
    geant4_input : 'input_7cell.geant4'
    geant4_threads : 120                          # reserves srun '-c 120' and sets the
                                                  # input file's 'nthreads' to match
    geant4_geometry_files :
      - '../assets/7cell_solid_whole.stl'
      - '../assets/7cell_cavity_whole.stl'

mode :
  type : single
  output_file : 'dose_single_output.txt'

# 'section:' names the scoring grid ('dose' reads output_dose, 'edep' reads
# output_edep) and 'quantity:' the reduction over its bins ('total', 'peak', or
# 'peak_index'). Naming a section is what routes the spec to the geant4 module,
# so 'module: geant4' is optional here.
output_parameters :
  'total_dose' : {module: geant4, section: dose, quantity: total}
  'peak_dose'  : {module: geant4, section: dose, quantity: peak}
  'total_edep' : {module: geant4, section: edep, quantity: total}
