# S3P parameter sweep with the ACE3P settings supplied inline (no separate
# .s3p file) on the declarative module/mode schema:
#   workflow:  cubit -> s3p
#   mode:      parameter_sweep
# The s3p module lists no 'input:' file — its ACE3P settings come entirely from
# the ace3p_input_parameters block below (duplicate-key aware, e.g. two Port
# blocks). cubit_input_parameters feeds the Cubit knobs.

workflow_parameters :
  'workdir' : 'lume-ace3p_s3p_workdir'
  'workdir_mode' : 'auto'

workflow :
  - module : cubit
    journal : 'bend-90degree.jou'
  - module : s3p
    tasks : 16
    cores : 4
    opts : '--cpu-bind=cores'

mode :
  type : parameter_sweep
  output_file : 's3p_sweep_output.txt'

cubit_input_parameters :
  'cornercut' :
    'min' : 12.0
    'max' : 16.0
    'num' : 5
  'rcorner2' :
    'min' : 4.0
    'max' : 16.0
    'num' : 3

ace3p_input_parameters :
    'ModelInfo' :
      'File' : './bend-90degree.ncdf'

      'BoundaryCondition' :
        'Exterior' : 6
        'Waveguide' : 7,8

    'FiniteElement' :
      'Order' : 2
      'CurvedSurfaces' : 'on'

    'FrequencyScan':
      'Start' : 9.424e+9
      'End' : 12.424e+9
      'Interval' : 0.25e+9

    'Port':
      'ReferenceNumber' : 7
      'NumberOfModes' : 1

    'Port' :
      'ReferenceNumber': 8
      'NumberOfModes' : 1
