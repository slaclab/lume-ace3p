# Geant4 dose-surrogate TRAINING-DATA collection (Phase 2 of the surrogate +
# inversion project). This drives the same declarative chain as the
# geant4_track3p_beta example --
#   workflow:  track3p_source -> particles -> geant4
# -- but under a NEW mode, 'collect_training_data', which scatters a
# design-of-experiments (DOE) sample over the 8-D field-enhancement vector
# beta = (beta0 .. beta7) (one per axial bin) and persists a (beta, dose_grid)
# training pair per sample into a resumable store.
#
# Key differences from geant4_track3p_beta.yaml:
#   * 'beta_inputs: [beta0 .. beta7]' -- one independent variable per bin,
#     instead of 'beta_input: beta' broadcasting a single scalar to all bins.
#   * 'bin_edges' is REQUIRED and fixed here (correctness constraint #1): the
#     beta->dose binning must be pinned so the map is stationary across the
#     whole campaign. The mode hard-fails if it is absent or the wrong length.
#   * The mode samples a DOE (Sobol / Latin-Hypercube) over the per-bin bounds
#     given under 'variables:', NOT a tensor grid.
#
# Large geometry / particle files live in ../assets/ and are referenced by
# relative path, so this example carries no multi-MB duplicates.

workflow_parameters :
  'workdir' : 'geant4_beta_surrogate_store'    # base; per-sample subdirs nest here
  'stage_mode' : 'symlink'                     # symlink large static inputs (e.g. the
                                               # Track3P dump) into each per-sample workdir
                                               # instead of copying. copy (default) | symlink | hardlink
  'paths' :
    'geant4_app_path' : '/sdf/group/rfar/geant4/example/dose-oneinputfile'
    'geant4_app_exe' : 'sim'

workflow :
  # External Track3P particle dump (produced outside the pipeline).
  - module : track3p_source
    file : '../assets/sample_track3p_particles.txt'

  # Field-emission weighting -> Geant4-format source file (particles.data).
  # 'beta_inputs' maps one input variable per bin (beta0->bin0, ...). The DOE
  # sampler sets all eight per sample. 'bin_edges' MUST be fixed (length
  # num_bins + 1 = 9) so the binning never drifts between samples.
  - module : particles
    impact_order : 1
    impact_face_id : 6
    work_function : 4.5
    dt : 1.0e-10
    num_bins : 8
    beta_inputs : ['beta0', 'beta1', 'beta2', 'beta3',
                   'beta4', 'beta5', 'beta6', 'beta7']
    output_format : 'geant4'
    output : 'particles.data'
    bin_edges : [-0.1251788, -0.093876, -0.062573, -0.03127, 0.000032,
                 0.031335, 0.062638, 0.093941, 0.1252434]

  # Geant4 dose/edep run. STL files named in the input file are copied into each
  # sample workdir automatically.
  - module : geant4
    geant4_input : 'input_7cell.geant4'
    geant4_geometry_files :
      - '../assets/7cell_solid_whole.stl'
      - '../assets/7cell_cavity_whole.stl'

mode :
  type : collect_training_data
  store : 'geant4_beta_surrogate_store'   # training store dir (table + fields + manifest)
  num_samples : 16                        # DOE size (power of 2 is ideal for Sobol)
  sampler : 'sobol'                       # 'sobol' (default) or 'lhs'
  seed : 0                                # reproducible design; enables clean resume
  fidelity : 10000                        # recorded Geant4 primary count (for Phase 5)

  # Per-bin beta bounds the DOE samples across (one entry per beta_inputs name).
  # [lo, hi] or {min: .., max: ..} are both accepted.
  variables :
    'beta0' : [40.0, 60.0]
    'beta1' : [40.0, 60.0]
    'beta2' : [40.0, 60.0]
    'beta3' : [40.0, 60.0]
    'beta4' : [40.0, 60.0]
    'beta5' : [40.0, 60.0]
    'beta6' : [40.0, 60.0]
    'beta7' : [40.0, 60.0]

# The 8 beta variables are field-enhancement knobs of the particles module (its
# 'beta_inputs' reads them), so they live under the 'particles:' input bucket --
# NOT 'cubit:' (Cubit is not part of this track3p_source -> particles -> geant4
# chain). Values are placeholders -- the DOE overrides them per sample.
input_parameters :
  particles :
    'beta0' : 50.0
    'beta1' : 50.0
    'beta2' : 50.0
    'beta3' : 50.0
    'beta4' : 50.0
    'beta5' : 50.0
    'beta6' : 50.0
    'beta7' : 50.0
