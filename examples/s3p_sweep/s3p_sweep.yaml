# S3P parameter sweep on the declarative module/mode schema:
#   workflow:  cubit -> s3p
#   mode:      parameter_sweep  (tensor product over the swept input axes)
# S3P exposes a Frequency field index, so the result table is emitted long-format
# (one row per (cornercut, rcorner2, Frequency)). 'output_file' names the result
# table written via the shared DataFrame.to_csv writer.

workflow_parameters :
  'workdir' : 'lume-ace3p_s3p_workdir'
  'workdir_mode' : 'auto'

workflow :
  - module : cubit
    journal : 'bend-90degree.jou'
  - module : s3p
    input : 'bend-90degree.s3p'
    tasks : 16
    cores : 4
    opts : '--cpu-bind=cores'

mode :
  type : parameter_sweep
  output_file : 's3p_sweep_output.txt'

input_parameters :
  cubit :
    'cornercut' :
      'min' : 12.0
      'max' : 16.0
      'num' : 5
    'rcorner2' :
      'min' : 4.0
      'max' : 16.0
      'num' : 3
