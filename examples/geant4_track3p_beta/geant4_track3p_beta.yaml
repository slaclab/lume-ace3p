# Geant4 beta sweep on the declarative module/mode schema. This is a runnable
# multi-step chain — external Track3P dump -> field-emission weighting -> dose:
#   workflow:  track3p_source -> field_emission -> geant4
#   mode:      parameter_sweep  (one Geant4 run per swept beta value)
#
# There is no in-pipeline Track3P/T3P solver in this refactor: particle tracking
# is run externally and the dump is supplied to 'track3p_source'. The 'particles'
# module owns the per-bin field-emission weighting (formerly particle_parameters),
# and 'beta_input' broadcasts the swept 'beta' scalar to all num_bins bins.

workflow_parameters :
  'workdir' : 'lume-ace3p_geant4_workdir'
  'workdir_mode' : 'auto'                       # one workdir per beta value
  'stage_mode' : 'symlink'                      # symlink large static inputs (Track3P dump,
                                                # STL geometry) into each workdir instead of
                                                # copying. copy (default) | symlink | hardlink
  'paths' :                                     # override executable paths
    'geant4_app_path' : '/sdf/group/rfar/geant4/example/dose-npass'
    'geant4_app_exe' : 'sim'

workflow :
  # External Track3P particle dump (produced outside the pipeline).
  - module : track3p_source
    file : '../assets/sample_track3p_particles.txt'

  # Field-emission weighting -> Geant4-format source file (particles.data).
  # The plain Fowler-Nordheim form of the LCLS-II reference converter ('fn',
  # the default): work function 4.2 eV, emission time one RF period at
  # 1.2999 GHz, impacts below 1 keV dropped, real-valued weights, macroparticles
  # standing for < 1 electron dropped. 'beta_input' broadcasts the swept 'beta'
  # variable to all num_bins bins (run 1 -> [40]*8, run 2 -> [45]*8, ...).
  # 'output' must match the 'particles = ...' line named in the Geant4 input
  # file below.
  - module : field_emission
    impact_order : 1
    impact_face_id : 6
    work_function : 4.2
    frequency : 1.2999e9
    min_energy_ev : 1000.0
    fn_model : 'fn'
    num_bins : 8
    beta_input : 'beta'
    output_format : 'geant4'
    output : 'particles.data'
    # 'bin_edges' : [...]      # optional: explicit edges, length num_bins + 1 (9)

  # Geant4 dose/edep run. The input file names its STL geometry by bare
  # filename (solid_stl / cavity_stl); since those shared STLs live in
  # ../assets/, list them under 'geant4_geometry_files' so they are staged into
  # each workdir. Override thread count with 'geant4_threads'.
  - module : geant4
    geant4_input : 'input_7cell.geant4'
    geant4_threads : 120                          # reserves srun '-c 120' and sets the
                                                  # input file's 'nthreads' to match
    geant4_geometry_files :
      - '../assets/7cell_solid_whole.stl'
      - '../assets/7cell_cavity_whole.stl'

mode :
  type : parameter_sweep
  output_file : 'geant4_beta_sweep_output'

# Swept input space, grouped by the code each variable drives. 'beta' is a
# field-enhancement knob of the field_emission module (its 'beta_input' reads it), so
# it lives under the 'particles:' bucket -- Cubit is not part of this
# track3p_source -> field_emission -> geant4 chain. It sweeps 40 -> 60 in 5 steps
# (40, 45, 50, 55, 60), which is where the dark-current onset sits for THIS dump:
# its InitialNormalField averages 3.7e7 V/m, about 4x Lixin's cryomodule, so the
# beta*E the LCLS-II study reaches at beta 120 is reached here near beta 30. On
# that study's own 100-150 range every macroparticle clears the one-electron cut
# at every point and the sweep writes a flat 144732 rows; across 40 -> 60 the
# surviving count climbs 2055 -> 60736 -> 124428 -> 144732 -> 144732 and the
# summed weight spans six decades, which is the behaviour worth plotting.
input_parameters :
  particles :
    'beta' :
      'min' : 40.0
      'max' : 60.0
      'num' : 5

  # Future (Xopt 8-D exploration): declare 8 independent variables under
  # 'particles:' (e.g. beta0..beta7) and set 'beta_inputs: [beta0, ..., beta7]'
  # on the field_emission module to map one per bin instead of broadcasting a scalar.

  # Optional: override settings in the Geant4 input file (plain keys, no '/').
  # A swept value here becomes an additional sweep axis.
  # geant4 :
  #   'nthreads' : 8
  #   'world_z' : {'min' : 200.0, 'max' : 300.0, 'num' : 3}

# Optional: pull scalars out of the Geant4 dose / energy-deposit output after
# each run. Each becomes a column in the result table; naming a 'section:' is
# what routes the spec to the geant4 module. The 'dose' section reads
# output_dose, 'edep' reads output_edep; 'quantity:' is the reduction over the
# scoring bins ('total', 'peak', or 'peak_index').
# output_parameters :
#   'total_dose' : {module: geant4, section: dose, quantity: total}
#   'peak_dose'  : {module: geant4, section: dose, quantity: peak}
#   'total_edep' : {module: geant4, section: edep, quantity: total}
